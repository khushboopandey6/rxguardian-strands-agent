[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rxguardian-strands-agent"
version = "1.0.0"
description = "AI Agent for Health Equity & Prescription Safety built with AWS Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.64.0",
    "boto3>=1.28.0",
    "pydantic>=2.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-dotenv>=1.0.0",
]
